project_name: coco_val2017_topic6_final
seed: 2026

dataset:
  images_dir: data/coco/val2017
  annotations: data/coco/annotations/instances_val2017.json
  # Independent final holdout after the 200-image repeated pilot.
  limit: 1000

model:
  weights: yolo11n.pt
  device: 0
  image_size: 640
  confidence: 0.001
  nms_iou: 0.7
  batch_size: 16

experiment:
  # The pilot covers severity 1--5. Final validation focuses on low, moderate,
  # and severe degradation while retaining a distinct 1,000-image COCO subset.
  corruptions: [gaussian_noise, salt_pepper, fog, low_light]
  severities: [1, 3, 5]
  # One fixed seed on the full 5,000-image set. Seed variation is reported
  # separately from the repeated 200-image pilot, avoiding redundant full runs.
  repeats: 1
  include_clean: true
  include_recovery: true
  recovery_severities:
    gaussian_noise: [3, 5]
    salt_pepper: [1, 3, 5]
    fog: [5]
    low_light: [3, 5]
  recovery_methods:
    # Fast edge-preserving Gaussian denoiser selected after the supplementary pilot.
    gaussian_noise: bilateral
  # COCO metrics, per-class AP and 81x81 confusion matrices remain saved.
  # Raw per-image predictions are omitted to keep the final run compact.
  save_predictions: false
  confusion_confidence: 0.25
  confusion_iou: 0.5

output_dir: runs/coco_topic6_final_1000
