project_name: coco_pilot
seed: 2026

dataset:
  images_dir: data/coco/val2017
  annotations: data/coco/annotations/instances_val2017.json
  limit: 200

model:
  weights: yolo11n.pt
  device: 0
  image_size: 640
  confidence: 0.001
  nms_iou: 0.7

experiment:
  corruptions: [gaussian_noise, salt_pepper, fog, low_light]
  severities: [1, 3, 5]
  repeats: 2
  include_clean: true
  include_recovery: true
  confusion_confidence: 0.25
  confusion_iou: 0.5

output_dir: runs/coco_pilot

